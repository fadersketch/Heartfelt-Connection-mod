[[mods]]
modId="heartfelt_connection"
version="1.0.0"
displayName="Heartfelt-connection (心契誓约×爱憎分明)"
authors="ZCode"
description="《心契誓约 × 爱憎分明》关系联动补丁：不对任何原版模组动刀，全部以 Mixin 运行时补丁实现——关系栏（<context> 结构化关系状态）、提示词运行时注入（favorability 量表/关系专属准则）、爱憎分明流程更改（恐惧/信任冻结、不背叛不淡忘、吃醋分层隔离）、关系传播广播、家庭保护、亲密互动工具。v1.1.0：修复爱憎分明兼容层（包名对齐）、心情记忆、仇恨标记过期、远程家庭保护、产后窗口对齐；新增背叛悔改（和解）系统、调试 API、公共配置。v1.2.0：关系模型升级——确认关系后信任/恐惧完全冻结、玩家造成的信任/恐惧变化等比折算为好感（跌破告白线 128 冻结解除、恋人关系破裂）；新增女仆主动告白（好感>192 周期性概率尝试、威胁检查后拉出告白对话框、接受成恋人/拒绝扣心情+写记忆+永不再主动）与关系破裂监视。v1.2.2：女儿线拓展（父女互动单双日交替、成长阶段事件）。v1.2.3：记忆事件带时间戳——告白被拒/悔改/女儿成长记录游戏时刻，AI 记忆与提示词注入带“第 N 天”时间锚点。v1.3.0（galgame 化）：P0 告白方向修正——玩家主动告白改走 heartfelt 自己的告白屏（玩家开口+女仆回应）；P1 事件历史系统（首见/首礼/告白发起方/救主/破裂史注入提示词）；P2 情境变量（饥饿/昼夜/群系/主人状态）；P3 后果文本弧（被拒后/破裂后/和好后的相处模式）；P4 女儿成年线（照顾爸爸的父女日常）；P5 纪念日/回忆杀（7/30/100/365 天里程碑）。v1.3.1：特殊奶增强——maidmarriage 的特殊奶对玩家饮用时解除负面效果（继承牛奶）+ 生命回复 I，附女仆系统消息并写入记忆（heartfelt NBT + Promaid 记忆桥）。v1.3.2：特殊奶文本按次数分级——妈妈（妻子）三档口吻（第 1 次害羞 / 第 2 次默许 / 第 3 次起当成日常），非妻子通用三档；气泡同步分级并修占位符。v1.4.0（机制修正）：魂符收掉抱着女儿的妈妈时，女儿不再「落地变普通女仆」——强制坐下等待妈妈回来（ToItem/ToMaid 监听）；孩子专属技能（附魔/酿药）成年后保留（出生女仆不限阶段），并防好感重置；心契誓约对话/互动界面与 heartfelt 告白屏对话期间世界静止（isPauseScreen，单机生效）；alt+J 对话面板新增「演绎剧情」按钮——配置 LLM 时按共同记忆沉浸式演绎剧情，脱离固定剧本。v1.4.1：玩家伤害惩罚——冻结层女仆（妻子/恋人/女儿）关系不破坏但有后果：连续伤害确认（30 秒内 3 次，误伤豁免）触发心情扣减 + 伤心窗口（坐着赌气、不主动互动、对话注入委屈文本）+ 系统消息/气泡；可选 LLM 伤心对话，无 LLM 自动降级为固定文本。前置 maidmarriage（心契誓约）+ callresponse（爱憎分明）+ touhou_little_maid（API 基础）。可与 Promaid（更智能的车万女仆）共存共享全局 API 配额。；v1.4.2：无 LLM 完整运作——主动对话类功能（家庭互动/广播/哀悼/纪念日）在 LLM 未配置或配额满时降级为固定文本气泡（玩家看到她在说话而非红色报错），演绎剧情按钮失败给出提示。；v1.4.3：新增测试工具【调整器】（形象=纸，仅创造栏+指令获取）——右击女仆打开聊天栏按钮菜单，一键调整好感/关系（恋人/妻子/女儿/解除）/心情/信任恐惧/成长阶段/事件记忆/清理状态，方便验证本补丁全部功能。；v1.4.4：调整器第2页——场景模拟（设背叛/哀悼/伤心/等妈妈/产后/丧子哀悼）、数值精度（信任恐惧绝对值/饥饿/心情全档）、实用（调试信息/拉回/坐站/认主/时间快进）、关系细节（告白失败/心碎/思慕/破裂次数），菜单分页。；v1.4.5：修复调整器右击无效果（补上漏写的右击事件入口，取消 TLM 女仆交互并打开菜单）+ 附魔光泽特效。；v1.4.6：调整器改为 GUI 界面（格式与 Promaid 手册一致：纯客户端 Screen + S2C 打开/刷新 + C2S 按钮动作），替代难操作的聊天栏按钮菜单。；v1.4.7：调整器界面与手册一致——打开时暂停世界（isPauseScreen=true），设置完成后关闭界面观察反应。；v1.4.8：调整器界面自适应——面板宽/高随窗口收窄（小窗口高 GUI 缩放下不再偏左超屏），按钮列宽同步自适应。；v1.4.9：修复调整器\"设女儿后再解除\"永久覆盖问题——彻底清除 maidmarriage persistent 女儿/血统标记（仿 markAsAdult），不再被每 tick 恢复逻辑改回女儿。；v1.4.10：调整器操作即时反馈——每个按钮点击后界面内显示黄色结果行（如\"好感 = 384\"\"已设为妻子\"\"已清除哀悼\"），不再只能靠状态行猜测。；v1.4.11：调整器\"选择性静止\"——打开时其他生物（含其他女仆）停止移动，仅玩家与正在对话的目标女仆可移动（替代 isPauseScreen 全暂停）；关闭界面自动恢复，含超时/登出/世界保存/重载兜底。；v1.5.0：告白流程重构——女仆主动告白加前摇（威胁检测→系统消息提示→走向玩家→走到身边才触发），触发后跳转心契誓约告白选项界面（世界可见、非全屏）；玩家主动告白界面改为叠加式（可见环境与女仆、宽度自适应）。；v1.5.1：修复叛变悔改——喂食判定改回蛋糕（原 f_42446_ 实为奶桶导致喂蛋糕无效）、所需次数 5→3、调整器清背叛后重新认主站起（变回可互动女仆）。；v1.5.2：修复 maidmarriage 原版 bug——灵体（MaidSpiritEntity）不再播放 TTS 语音包（服务端 tts 入口拦截，文本对话不受影响）。；v1.5.3：哀悼可见表现——哀悼开始即有系统消息+女仆坐下+气泡（无 LLM 也生效），窗口到期自动恢复站姿。；v1.5.4：思慕/破裂可见化——思慕改设 mood_data.lastInteractionDay（靠近时心形粒子+思慕对话，状态行显示思慕中），破裂/思慕设置带系统消息说明效果。；v1.5.5：选择性静止改挂 Alt+J 对话面板（打开时其他生物定住、玩家与对话女仆可动，关闭恢复）；调整器等其他场合不再触发时间暂停。；v1.5.6：死亡哀悼改为死亡调侃——玩家会复活且女仆会传送重生点，哀悼拒绝互动与复活矛盾；玩家死亡时关系女仆按档位说一句调侃/关心（无状态窗口），手动哀悼窗口（调整器）保留用于测试机制。；v1.5.7：恢复调整器的选择性静止（打开调整器时其他生物定住、玩家与目标女仆可动，关闭恢复），与 Alt+J 对话静止共用同一机制。；v1.5.8：对话安全区——女仆主动告白与 Alt+J 对话面板打开前，玩家与女仆周围一定半径内无敌对生物才可进行（否则提示先打掉敌人），原版缺失的合理性补丁。；v1.5.9：修复主人攻击限伤失效（根因是爱憎分明的中性源重放绕过 TLM÷5/promaid 上限/惩罚——非 Better Combat），恢复 TLM 原版限伤并让惩罚识别重放伤害；空手攻击本身有效，伤害被限伤压低属正常语义。；v1.5.10：空手攻击女仆恢复可见——查证驯养革新有\"玩家非潜行攻击宠物取消伤害\"的保护（被 callresponse 重放绕过），空手 1.0 经 ÷5 后被护甲吸收到无反馈；现空手豁免 ÷5（低伤害无需限伤），武器保持 TLM ÷5 封顶 2。；v1.5.11：修复\"空手/方块打不到女仆\"——Better Combat 挥击后设置长攻击冷却(missTime)，doAttack 开头拒绝所有原版攻击；对女仆豁免冷却（仅女仆，其他生物遵循 BC 节奏）。；v1.5.12：纪念日里程碑天数比较修复——旧版把\"上次触发的绝对游戏日\"与\"相对里程碑天数\"直接比较，告白/首见发生较晚时首次触发后 30/100/365 里程碑永远无法触发；改为与该里程碑的绝对触发日（基准日+天数）比较，并配合 Promaid 侧纪念日联动（里程碑达成/临近 → 关系记忆+情绪脉冲+补位说话），双方检测结果一致。；v1.5.13：调整器（调试工具）补全纪念日/promaid 联动测试——状态行显示「纪念日第N天·达成M」；新增测试按钮「首见7天前」（首见=7天前→7天里程碑立即到期）、「纪念日重置」（清防重触发标记，可重复测）、「时间+3天/+7天」（快进）；「调试信息」追加纪念日里程碑 + Promaid 联动状态（达成/临近游标、下个里程碑距触发天数）。；v1.5.14：修复启动崩溃——AIChatScreenDramatizeMixin 注入 Screen 的【继承方法】onClose(m_7379_)，特定加载时机下 Mixin 目标解析失败（InvalidInjectionException: could not find any targets matching 'm_7379_'，启动即崩）。注入改 require=0 非致命（解析不到只警告）；对话静止的恢复由 DialogueFreezeManager 的 5 分钟无活动超时/登出/世界保存/停服兜底自动执行，不影响功能。；v1.5.15：修复启动崩溃——CallResponseHurtLimitMixin 目标是爱憎分明（callresponse）自己的 mixin 类 MixinEntityMaid，Mixin 硬规则禁止给另一个 mixin 当目标（Cannot add target ... because the target is a mixin，PREPARE 阶段即崩）。该 mixin 从 required 配置移入 optional 配置（required=false + defaultRequire=0）：目标解析失败只警告不崩溃；环境有利时照常生效，保留主人攻击限伤修复。；v1.5.16：修复调整器显示——用户反馈「关系以及好感显示不完全」：状态行/标题在 GUI 小于面板（高 guiScale / 小窗口）时因面板居中溢出屏幕而被截。修复：① 面板位置钳制（guiW/guiH 小于面板时从屏幕边角开始，左/上留 4px，不再居中溢出）；② 状态行与结果行按面板宽度截断（超长加省略号，不再溢出面板右缘）；③ 面板最小高回退 238（小窗口不再整体超高出屏），第 2 页第 8 行（纪念日测试按钮）按窗口高度自适应——空间不足时自动隐藏，不再压住底部翻页按钮。；v1.5.17：修复女仆主动告白四项问题（用户反馈：难触发 / 触发后全部静止 / 前摇文本被跳过直接拉告白选项 / 系统消息与告白间缺 2-3 秒间隔）——(1)【距离 bug 修复】m_20280_ 是平方距离：触发判定旧版与线性 32 格比较实际只有 5.7 格内才尝试（难触发根因）→ 改 maxDist²；到达判定旧版 1.58 格才算走到 → 改 Math.sqrt 真 2.5 格；(2)【前摇时序】系统消息发出后至少等 approachMinTicks（默认 50=2.5 秒）才拉告白选项——女仆已在身边时不再第一秒就触发、前摇文本/走向不再被跳过（2-3 秒间隔）；(3)【选择性静止】告白选项界面（maidmarriage HugActionScreen）不再强制全屏暂停（v1.4.0 的 isPauseScreen=true 会让主人与告白女仆也停住，违背用户「主人与对话女仆不停」要求）——改为服务端 DialogueFreezeManager 选择性静止（其他生物定住、主人与告白女仆可动），界面关闭时反射 HugClientState 取女仆 UUID 发 ChatFreezePacket(false) 恢复；(4)【触发放宽】威胁半径 48→24、基础概率 0.15→0.20（需删除 config/heartfelt-common.toml 重新生成默认值；距离修复为代码级永远生效）。；v1.5.18：吃醋隔离改全局绝对压制（用户反馈：确认关系后吃醋不再触发，但妻子被收进魂符/暂时不在时又恢复互殴吃醋——检测人在不在太薄弱）——根因：ownerHasDedicatedMaid 是【在场扫描】（主人周围 32 格找已确认关系女仆），妻子进魂符（MaidSpiritEntity）不在扫描范围即失效。修复：主人玩家 ForgeData 新增持久标记 heartfelt_dedicated（任一女仆确认关系即置位）——ownerHasDedicatedMaid 标记优先（绝对压制、不依赖在场），未置时原扫描发现关系女仆自愈写标记；确认关系路径（玩家告白接受/女仆主动告白补记/周期扫描）即时写标记。；v1.5.19：修正压制标记生命周期（用户澄清：关系破裂应清除压制效果；离婚未实现、不延伸）——checkBreakups（恋人跌破告白线→关系破裂）破裂后清除 heartfelt_dedicated 标记，但**仅当该玩家已无任何确认关系女仆**（结婚是永久契约、本 mod 不离婚——有其他关系女仆如妻子则标记保留，吃醋继续压制；全部关系解除后吃醋恢复）。；v1.5.20：告白压制同改事件判定（用户反馈：妻子暂时不在场时其他女仆又向玩家告白，修复方法仍以事件判定而非角色判定）——根因：MaidConfessionManager.hasDeclaredPartner 是【在场扫描】（该玩家 48 格内找已确认关系女仆），妻子进魂符/暂时不在即失效。修复：hasDeclaredPartner 改为查主人玩家全局标记 heartfelt_dedicated（与吃醋隔离同语义：确认过关系即压制，不依赖配偶在场；全部确认关系解除时随标记清除而恢复）；新增 RelationshipExemption.playerHasDedicated 并重构 ownerHasDedicatedMaid 共用之。；v1.5.21：幼年女儿三约束（用户反馈：太小的女仆不该播语音包；任务栏应锁空闲无法切换任务，长大才能帮忙；太小女儿坐下不能被解除，应强制坐下）——新增 ChildGuardManager.isTooSmall（INFANT/JUVENILE 女儿）：① 语音包拦截：MaidSpiritTtsGuardMixin 在灵体判断后追加 isTooSmall → 不播 TTS（LLM 文本对话不受影响）；② 任务锁空闲：每 2 秒周期强制，非空闲任务（挖矿/建造/附魔等）拉回 TaskManager.getIdleTask（自愈式，UI 选择会被拉回）；③ 强制坐下：每 2 秒周期，未骑乘（没被妈妈抱着）时 setOrderedToSit(true)——玩家解除坐姿会被坐回去；被妈妈抱着时维持原版抱起。长大（CHILD/ADULT）后全部恢复。；v1.5.22：告白屏外观美化（用户反馈：文本框过于偏左、黑漆漆一片不好看）——PlayerConfessionScreen 面板改粉色透明（内部粉色半透明填充 0x9AF7C9DD + 粉色描边 0xC8E89BC8，不再黑底），正文每行按自身像素宽度在面板内居中（不再贴左），标题保持粉色居中。；v1.5.23：修复告白屏三按钮叠加（用户反馈：回应阶段出现\"郑重说出/好/再想想\"三个选项横排、排版奇怪且点了结果都一样）——根因：PlayerConfessionScreen 的 m_7856_（init）被 commit()/receiveResult() 重复调用，且 override 未走基类 clearWidgets 流程，各状态按钮从未清除导致叠加。修复：init 开头显式 m_169413_()（clearWidgets，与 AdjusterScreen 同款），每次重建前清空旧按钮。修复后各状态按钮：玩家开口=郑重说出/再想想，等待回应=无按钮，女仆回应=好（关闭）。；v1.5.24：修复小女仆灵体播放心契语音包（用户反馈：幼年女儿灵体播放语音包仍在发生）——根因：maidmarriage 的心契语音包是独立音频系统（HeartPactVoicePlayback 播放本地 voice pack 文件），完全不经过 TLM 的 MaidAIChatManager.tts，v1.5.2/v1.5.21 的 TTS 拦截对它无效；灵体（MaidSpiritEntity）与幼年女儿的 maidmarriage 对话（HugActionScreen）播放心契语音时走 HeartPactVoicePlayback.play() 统一出口。修复：新增 HeartPactVoicePlaybackMixin（optional 配置，@Pseudo + 字符串 targets）在 play() HEAD 拦截——目标女仆是灵体或幼年女儿（isTooSmall）则取消播放，正常女仆语音不受影响。；v1.5.25：女儿称呼统一为爸爸/父亲（用户反馈：小女仆对主人的称呼应该都是爸爸或者父亲）——heartfelt 侧：PromptTexts 四个女儿准则段（通用/幼儿/少女/成年）全部追加 ADDRESS RULE 称呼铁律——对主人说话必须称呼爸爸或父亲，严禁叫主人、亲爱的、先生或名字；promaid 侧：AiMemoryContext 女儿关系标签改写——我是主人的女儿，主人就是我的爸爸/父亲，对主人说话必须称呼爸爸或父亲（覆盖原「主人是我的女儿」的「主人」称呼暗示）。双通道提示词注入共同生效（heartfelt 准则段 + promaid 记忆上下文）。；v1.5.26：幼年女仆（小婴儿）强化约束（用户反馈：幼年女仆相当于小婴儿，对话与各方面需要额外设定；任务拉回要瞬间完成；手中不能拿武器只能拿食物；尝试执行其他任务会被立刻拉回空闲并在系统提示中写年龄太小）——① 瞬间拉回：ChildGuardManager 周期 40 tick→5 tick（0.25 秒），任务/坐姿立即自愈；② 年龄太小提示：任务被拉回空闲时给主人系统提示「年龄太小了，还不能做任务」（2 秒冷却防刷屏）；③ 手持限食物：主手/副手非食物（武器/工具/杂物）每 5 tick 拿走放回女仆背包，背包满丢到脚下不吞物品；④ 攻击婴儿文本：PlayerHarmPenaltyManager 对幼年女儿被玩家攻击【立即】（无需 3 次累积）触发婴儿哭泣——系统消息+气泡「呜哇——！」（5 秒冷却），可选 LLM 婴儿哭泣对话；婴儿不适用成年女仆的累积惩罚/伤心窗口/心情扣减。；v1.5.28：幼年女儿送礼文本改婴儿版（用户反馈：心契誓约对很小女仆的文本有问题，主文本虽是婴儿内容，但送礼触发的文本仍是少女女儿文本）——根因：maidmarriage 送礼对话只有一套「儿童」文本（CHILD_GIFT_DIALOGUE_KEYS，少女口吻），giftDialogueKey 用 shouldStayChild 只区分 ADULT/非 ADULT，INFANT/JUVENILE 小婴儿也命中少女文本。修复：新增 Ch