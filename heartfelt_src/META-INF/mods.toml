idCheck 只认每帧准星命中（EntityHitResult），坐着的女仆（幼儿实体小/坐姿姿态）射线易穿过瞄到后方，maidCheck 返回 null；v1.5.37 的兜底只认 maidmarriage 女儿实体（MaidChildEntity），普通女仆/成女女儿坐着（等妈妈/强制坐/手动坐）同样瞄不准却无兜底。修复：兜底扩展到【所有属于该玩家的女仆】（不限女儿实体），视线锥角 32°→41°（坐下的小女仆低头视角也能命中）；潜行限制保留。；v1.5.61：调整器状态行居中（用户反馈：调整器最上面的字段仍然偏左，应移至正中间）——标题本就居中于面板中心；状态行（好感/心情/信任/恐惧等）与操作结果行原从面板左缘 +12px 左对齐绘制，改为与标题一致居中于面板中心（截断逻辑保留，超长仍省略号防溢出）。；v1.5.62：修复女儿纪念日基准仍按告白日计算（用户反馈：对女儿点击首见，弹出来的仍然是告白类型的纪念日）——根因：v1.5.48 只把女儿纪念日的文本改成父女向，但 milestoneDue 的天数基准仍是告白优先于首见——女儿的 CONFESSION_AT 若有残留（如调整器测试时点过告白=今天），点首见后纪念日仍按告白日计算，弹出的天数/事件就是告白类型的。修复：milestoneDue 加女儿分支——女儿纪念日基准只用出生/初见（EVENT_FIRST_MEET），彻底无视任何残留告白日。调整器纪念日按钮（首见=今天/首见7天前等）对女儿同样有效。；v1.5.63：修复幼女丢武器无限循环（用户反馈：要求女儿丢武器，结果一直丢、丢到地上手中仍握武器、武器无限刷新增多）——反编译实证：原版 spawnAtLocation 只生成物品实体不扣减/不清手持，TLM MaidBrain 捡拾 AI 会把丢出的武器自己捡回（pickupItem 尊重拾取延迟，但旧版没设延迟）——丢→捡→再丢循环，且每次用同一 ItemStack 引用生成实体，地上武器无限增多。修复：① 先清空手持再丢【副本】（实体与手持彻底脱钩）；② 实体归属玩家（setOwner，玩家碰触清延迟可正常捡起）；③ 实体设置无限拾取延迟（setPickUpDelay 1000000，女仆 AI 尊重延迟永不捡回，循环断开；玩家不捡则 5 分钟后按原版规则消失）。；v1.5.64：婴儿幼儿语音彻底禁 + 幼儿可行走（用户反馈：婴儿和幼儿仍然可以播放语音包，应把 TLM 声音频率调成 0；幼儿可以行走但婴儿不行，其他无区别，两者都不能播放语音包）——① 语音彻底禁：反编译实证 TLM 女仆声音频率驱动的自主讲话声（ambient 声音包语音）走 EntityMaid.getAmbientSound，不经 AI 聊天 tts（已拦）也不经心契语音（已拦）——最后缺口；新增 MaidAmbientVoiceMixin 拦 getAmbientSound 返回 null（等效声音频率=0）+ 拦捡拾声，婴儿/幼儿完全不发声包语音；② 行走区分：新增 isInfant（仅 INFANT），强制坐下只对婴儿——幼儿（JUVENILE）可以行走，但任务锁空闲/手持限食物/禁语音与婴儿一致（isTooSmall 不变）。；v1.5.65：广播女儿事件跳过妈妈（用户反馈：如果是妻子，系统提示应该删掉——xx好奇地望着那个孩子：这就是丈夫的女儿吗？真可爱——妈妈是自己的亲妈，不会好奇自己的孩子）——根因：关系广播（主人有女儿）遍历玩家所有其他女仆，妻子（妈妈）也在其中，播了这段外人口吻的文本。修复：broadcastToOtherMaids 先解析关系女仆（女儿）的妈妈 UUID，遍历时跳过孩子的妈妈——妈妈不需要得知自己的孩子，也不再说这就是主人的女儿吗；其他女仆的广播文本不受影响。；v1.5.66：调整器解除关系时清压制标记（用户反馈：调整器里结婚后再解除，其他女仆仍受结婚关系影响——生存模式可接受，但创造模式调整器应该能彻底解掉）——根因：clearRelations 解除了 maidmarriage 的婚姻/告白/女儿，但没清除玩家 ForgeData 的heartfelt_dedicated 标记（确认过关系即吃醋隔离/告白压制）——标记残留，其他女仆继续受已解除关系影响。修复：clearRelations 后调用 RelationshipExemption.clearDedicatedIfNone（该玩家已无其他确认关系女仆时清标记，与 v1.5.19 破裂语义一致；还有其他关系女仆则保留）。；v1.5.67：修复幼儿被打好感度惩罚丢失 + 反馈可见化（用户反馈：打小女仆似乎不会触发减好感度的事件）——排查：maidmarriage 儿童好感就是 TLM favorability（实证 favorRate/checkFavorabilityGate 都读 getFavorability），好感 API 正确；薄弱点在 hurt 入口的 EntityMaidHurtRecordMixin 只查 directEntity（m_7640_）——远程弓/弩在 hurt 入口记录不上，LivingHurtEvent 链若被其他 mod 取消/时序打断，幼儿好感惩罚就丢。修复：① hurt 入口补查 getEntity（m_7639_，远程造成者）——近战/远程/重放都记录；② 大哭消息带明确反馈——主人来源扣好感时消息显示好感度 -1（不再困惑减没减）。；v1.5.68：婴儿幼儿系统消息全面盘点（用户要求：婴儿和幼儿除了哇哇大哭以外的系统消息都不太应该触发）——盘点全部 26 个玩家系统消息调用点：死亡调侃（玩家死亡时关系女仆调侃）与哀悼（悲伤窗口）对婴儿/幼儿不应触发（婴儿不会说话、不理解死亡）——修复：FamilyMourningManager 死亡调侃与 applyMourning 均跳过 isTooSmall；保留的婴儿合理系统消息：哇哇大哭（被打）、年龄太小不能做任务、武器拿不住、等妈妈/妈妈回来旁白、成长又长大了一点（旁白式）；其余（父女互动/母女/纪念日/广播/暗恋/告白/伤心/思慕等）此前已按幼儿跳过或婴儿本就不触发。"

